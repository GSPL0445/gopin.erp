<style>
/* Layout: Dynamics-style shell — dark module rail left, action pane + FastTab forms right */
:root{
  --bg:#eef2f3; --surface:#ffffff; --surface-2:#f6f8f9; --ink:#15212a; --muted:#5a6b76; --line:#d5dee2;
  --accent:#0d7468; --accent-soft:#dcefeb; --accent-ink:#ffffff;
  --rail:#14232b; --rail-ink:#c4d3da; --rail-hi:#ffffff; --rail-active:#1f3742;
  --good:#2b7a4b; --good-soft:#e0f1e6; --warn:#a5650f; --warn-soft:#fbefd9; --bad:#b33a2e; --bad-soft:#f8e1de; --info:#2f5f9e; --info-soft:#e1eaf6;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1418; --surface:#141e24; --surface-2:#18242b; --ink:#e2eaee; --muted:#8fa2ad; --line:#26353d;
  --accent:#38b3a2; --accent-soft:#163632; --accent-ink:#06211d;
  --rail:#091014; --rail-ink:#9fb2bb; --rail-hi:#ffffff; --rail-active:#17262e;
  --good:#5cc187; --good-soft:#15301f; --warn:#e2a54b; --warn-soft:#33270f; --bad:#ec7f72; --bad-soft:#3a1915; --info:#7fa8e0; --info-soft:#17253a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1418; --surface:#141e24; --surface-2:#18242b; --ink:#e2eaee; --muted:#8fa2ad; --line:#26353d;
  --accent:#38b3a2; --accent-soft:#163632; --accent-ink:#06211d;
  --rail:#091014; --rail-ink:#9fb2bb; --rail-hi:#ffffff; --rail-active:#17262e;
  --good:#5cc187; --good-soft:#15301f; --warn:#e2a54b; --warn-soft:#33270f; --bad:#ec7f72; --bad-soft:#3a1915; --info:#7fa8e0; --info-soft:#17253a;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding-block:14px 24px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 12px;color:var(--rail-hi)}
.brand .mark{width:30px;height:30px;border-radius:6px;background:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;color:var(--accent-ink);font-size:13px;flex:none}
.brand b{font-size:15px;letter-spacing:.01em}.brand small{display:block;font-size:11px;color:var(--rail-ink);font-weight:400}
.who{margin:0 8px 6px;padding:8px 10px;border-radius:6px;background:var(--rail-active);font-size:12px;color:var(--rail-ink)}
.who b{display:block;color:var(--rail-hi);font-size:13px;font-weight:500}
.grp{margin-top:12px}
.grp h3{margin:0 0 4px;padding:0 8px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rail-ink);opacity:.7;font-weight:600}
.grp a{display:block;padding:5px 8px;border-radius:5px;color:var(--rail-ink);text-decoration:none;font-size:13.5px}
.grp a:hover{background:var(--rail-active);color:var(--rail-hi)}
.grp a.on{background:var(--rail-active);color:var(--rail-hi);box-shadow:inset 3px 0 0 var(--accent)}
.main{min-width:0;padding-block:0 40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:12px;padding:14px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.top .co{font-weight:600}.top .sp{flex:1}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;cursor:pointer}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.dot.live{background:var(--good)}.dot.local{background:var(--warn)}
.note{background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:12px}
h1{font-size:22px;margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.crumb{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.pane{display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px;margin-bottom:14px;position:relative}
.btn{border:1px solid transparent;background:transparent;padding:6px 11px;border-radius:5px;cursor:pointer;font-size:13.5px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-2);border-color:var(--line)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}.btn.pri:hover{filter:brightness(1.07)}
.btn.wf{border-color:var(--accent);color:var(--accent);font-weight:600}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
.sep{width:1px;align-self:stretch;background:var(--line);margin:2px 4px}
.search{margin-left:auto;min-width:0;flex:0 1 240px;border:1px solid var(--line);background:var(--surface-2);border-radius:5px;padding:6px 10px}
.pop{position:absolute;top:calc(100% + 4px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgb(0 0 0 / .14);padding:4px;min-width:210px}
.pop button{display:block;width:100%;text-align:left}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:12px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.tab .tablewrap{border:0;border-radius:0}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover td{background:var(--accent-soft)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.code{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);white-space:normal}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--surface-2);border:1px solid var(--line)}
.p-good{background:var(--good-soft);color:var(--good);border-color:transparent}.p-warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.p-bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}.p-info{background:var(--info-soft);color:var(--info);border-color:transparent}
.p-acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tab{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.tab>h2{margin:0;padding:10px 14px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tab>h2 .sp{flex:1}
.tab .body{padding:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 16px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}.fld.w2{grid-column:span 2}
.fld label{font-size:12px;color:var(--muted);font-weight:500}.fld label i{color:var(--bad);font-style:normal}
.fld input,.fld select,.fld textarea,.lines input,.lines select{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:6px 8px;width:100%;min-width:0}
.fld textarea{min-height:60px;resize:vertical}
.fld input[readonly],.fld select[disabled],.lines input[readonly],.lines select[disabled]{background:var(--surface-2);color:var(--muted)}
.chk{flex-direction:row;align-items:center;gap:8px;padding-top:20px}.chk input{width:auto}
.lines td{padding:5px 6px}.lines input,.lines select{padding:5px 6px}
.lines td.n{width:110px}.lines td.x{width:36px}
.lines td.n input{min-width:80px}.lines td select{min-width:180px}
.xbtn{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:4px}.xbtn:hover{color:var(--bad);background:var(--bad-soft)}
.totals{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px 24px;padding:10px 14px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.totals b{font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tile .k{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .s{font-size:12.5px;color:var(--muted)}
.tile.alert{box-shadow:inset 3px 0 0 var(--bad)}
.flow{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden}
.flow a{flex:1 1 130px;padding:12px 14px;text-decoration:none;color:var(--ink);border-right:1px solid var(--line)}
.flow a:last-child{border-right:0}.flow a:hover{background:var(--accent-soft)}
.flow .st{font-size:11px;font-family:var(--f-mono);color:var(--accent);letter-spacing:.04em}
.flow .nm{font-weight:600}.flow .ct{font-size:12.5px;color:var(--muted)}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.cols2>*{min-width:0}
.log{list-style:none;margin:0;padding:6px 14px 12px;font-size:13px}
.log li{display:flex;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line)}.log li:last-child{border:0}
.log time{color:var(--muted);font-variant-numeric:tabular-nums;min-width:132px}
/* gantt */
.gantt{min-width:780px}
.g-row{display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid var(--line)}
.g-row:last-child{border-bottom:0}
.g-lab{padding:8px 10px;font-size:13px;border-right:1px solid var(--line)}.g-lab small{display:block;color:var(--muted);font-size:11.5px}
.g-track{position:relative;min-height:44px;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100%/7) 100%}
.g-head .g-track{min-height:30px}
.g-day{position:absolute;top:0;padding:6px 6px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.g-bar{position:absolute;top:8px;height:28px;border-radius:4px;background:var(--info-soft);color:var(--info);border:1px solid var(--info);font-size:11.5px;padding:0 6px;overflow:hidden;white-space:nowrap;line-height:26px;cursor:pointer;font-family:var(--f-mono)}
.g-bar.ip{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.g-bar.done{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.g-bar.late{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.g-now{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);opacity:.6}
.ures{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.ures button{text-align:left}
#modal{position:fixed;inset:0;background:rgb(10 18 22 / .45);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:10px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:18px}
.dlg h2{margin:0 0 8px;font-size:17px}.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.dlg ul{padding-left:18px;margin:8px 0;font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.t{background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:6px;font-size:13.5px;box-shadow:0 6px 20px rgb(0 0 0 / .2);max-width:90vw}
.t.err{background:var(--bad);color:#fff}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
@media (max-width:860px){
  .top{gap:8px}.top .co{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sync{font-size:11px}
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s;padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .rail.open{transform:none;box-shadow:0 0 0 100vmax rgb(0 0 0 / .4)}
  .menu-btn{display:inline-block}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .fld.w2{grid-column:auto}
  .search{flex-basis:100%;margin-left:0}
}
@media (prefers-reduced-motion:reduce){.rail{transition:none}}
body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.who .btn{color:var(--rail-ink);border-color:var(--rail);background:var(--rail)}.who .btn:hover{color:var(--rail-hi);border-color:var(--rail-ink)}
#login{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center;padding:16px}
.lcard{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px}
.lcard .brand{color:var(--ink);padding:0 0 18px}.lcard .brand small{color:var(--muted)}
.lcard form{display:flex;flex-direction:column;gap:12px}.lcard .btn.pri{padding:9px 12px;font-weight:600}
.lerr{color:var(--bad);font-size:13px;min-height:18px}
</style>

</head>
<body>
<div id="login" hidden>
  <div class="lcard">
    <div class="brand"><div class="mark">GS</div><div><b>Gopin Semicon Private Limited</b><small>Manufacturing ERP · sign in</small></div></div>
    <form id="loginForm" autocomplete="on">
      <div class="fld"><label for="lemail">Email</label><input id="lemail" type="email" autocomplete="username" required></div>
      <div class="fld"><label for="lpass">Password</label><input id="lpass" type="password" autocomplete="current-password" required></div>
      <div class="lerr" id="lerr" role="alert"></div>
      <button class="btn pri" type="submit" id="lbtn">Sign in</button>
    </form>
    <p class="hint">Forgot your password? Ask your ERP admin to reset it.</p>
  </div>
</div>
<div class="app">
  <aside class="rail" id="rail"></aside>
  <main class="main">
    <header class="top">
      <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰ Menu</button>
      <span class="co" id="coName">Gopin Semicon Private Limited</span>
      <span class="sp"></span>
      <button class="btn" id="installBtn" hidden>Install app</button>
      <span class="sync" id="sync"><span class="dot"></span>Connecting…</span>
    </header>
    <div id="view"></div>
  </main>
</div>
<div id="modal" hidden></div>
<div id="toast" aria-live="polite"></div>
<input type="file" id="fileIn" accept=".xlsx,.xls,.csv" hidden>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sid=v=>{let s=String(v??'').trim().replace(/[^A-Za-z0-9_\-.~:@+]/g,'_');if(!s||s==='.'||s==='..')s='_'+s;return s.slice(0,180)};
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const addDays=(ds,k)=>{const d=new Date(ds+'T00:00');d.setDate(d.getDate()+k);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const DAYMS=864e5;
const n=v=>{const x=parseFloat(String(v??'').replace(/,/g,''));return isFinite(x)?x:0};
const fmt=(v,d=2)=>Number(v||0).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
const q3=v=>fmt(v,Number.isInteger(+v)?0:3);
const inr=v=>'₹'+fmt(v);
const clone=o=>JSON.parse(JSON.stringify(o??{}));
const fmtDT=ms=>ms?new Date(ms).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:false}):'';
const fmtD=s=>s?new Date(s+'T00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'';
function toast(msg,err){const t=document.createElement('div');t.className='t'+(err?' err':'');t.textContent=msg;$('#toast').appendChild(t);setTimeout(()=>t.remove(),err?5200:2600)}

/* ---------- reference data ---------- */
const STATES=[['01','Jammu and Kashmir'],['02','Himachal Pradesh'],['03','Punjab'],['04','Chandigarh'],['05','Uttarakhand'],['06','Haryana'],['07','Delhi'],['08','Rajasthan'],['09','Uttar Pradesh'],['10','Bihar'],['11','Sikkim'],['12','Arunachal Pradesh'],['13','Nagaland'],['14','Manipur'],['15','Mizoram'],['16','Tripura'],['17','Meghalaya'],['18','Assam'],['19','West Bengal'],['20','Jharkhand'],['21','Odisha'],['22','Chhattisgarh'],['23','Madhya Pradesh'],['24','Gujarat'],['26','Dadra and Nagar Haveli and Daman and Diu'],['27','Maharashtra'],['29','Karnataka'],['30','Goa'],['31','Lakshadweep'],['32','Kerala'],['33','Tamil Nadu'],['34','Puducherry'],['35','Andaman and Nicobar Islands'],['36','Telangana'],['37','Andhra Pradesh'],['38','Ladakh'],['97','Other Territory'],['96','Outside India (Export)']];
const STATE_N=STATES.map(s=>s[1]);const stCode=s=>STATES.find(x=>x[1]===s)?.[0]||'';
const ITEM_TYPES=['Raw Material','Semi-Finished','Finished Good','Consumable','Packing Material','Spare Part'];
const FG=['Finished Good','Semi-Finished'];
const GP_TYPES=['Inward','Outward - Returnable (RGP)','Outward - Non-Returnable (NRGP)'];
const ROLES={
 'Admin':{m:'*',a:1,d:'Everything, including user roles and approvals above the PO limit'},
 'Purchase Manager':{m:['purchase','masters'],a:1,d:'Purchase orders and item masters; approves POs up to the limit'},
 'Purchase Executive':{m:['purchase'],d:'Creates purchase orders and suppliers'},
 'Stores Manager':{m:['stores','gate','masters'],a:1,d:'GRN, dispatch, stock journals, gate passes; approves journals and gate passes'},
 'Stores Executive':{m:['stores','gate'],d:'Enters GRN, dispatch, stock journals and gate passes'},
 'Production Manager':{m:['production'],a:1,d:'BOMs, routings, work centers; releases production orders'},
 'Production Supervisor':{m:['production'],d:'Creates production orders, issues material, marks operations done'},
 'Sales Manager':{m:['sales'],a:1,d:'Customers and sales orders; confirms sales orders'},
 'Sales Executive':{m:['sales'],d:'Creates customers and sales orders'},
 'Accounts':{m:['accounts'],a:1,d:'Creates and posts sales and purchase invoices'},
 'Security Guard':{m:['gate'],d:'Creates gate passes and marks gate in / gate out'},
 'Viewer':{m:[],d:'Can look at everything, change nothing'},
};

/* ---------- configuration ---------- */
const ENT={
 items:{title:'Items',one:'Item',key:'code',imp:1,mod:'masters',fields:[
  {k:'code',l:'Item Code',req:1},{k:'name',l:'Item Name',req:1,w:2},{k:'type',l:'Item Type',t:'sel',o:ITEM_TYPES,req:1},

  try{r=await fetch(u,{method:m,credentials:'same-origin',headers:m==='GET'?{}:{'Content-Type':'application/json','X-ERP':'1'},body:b!==undefined?JSON.stringify(b):undefined})}
  catch(e){throw {code:'unavailable',message:'Server not reachable. Check your internet connection.'}}

  if(r.status===401&&!u.endsWith('/login')){showLogin('Your session ended. Please sign in again.');throw {code:'unauth',message:t.error||'Please sign in.'}}
  if(!r.ok)throw {code:r.status===403?'forbidden':'error',message:t.error||('Server error '+r.status)};

async function put(c,id,data){S[c][id]=data;try{await API.j('PUT',`/api/docs/${enc(c)}/${enc(id)}`,data)}catch(e){wErr(e);reloadCol(c);throw e}}

function fyCode(ds){const d=new Date((ds||today())+'T00:00'),y=d.getFullYear(),m=d.getMonth()+1;if(company.fy==='January')return String(y);const s=m>=4?y:y-1;return String(s).slice(2)+String(s+1).slice(2)}
function docNo(c,v,d){if(c.preFn){const p=c.preFn(d);let m=0;for(const x of list(v)){const s=String(x.no||'');if(s.startsWith(p+'/')){const k=+s.slice(p.length+1);if(k>m)m=k}}return p+'/'+String(m+1).padStart(4,'0')}
 let m=0;for(const x of list(v)){const r=String(x.no||'').match(/(\d+)$/);if(r)m=Math.max(m,+r[1])}return c.pre+'-'+String(m+1).padStart(4,'0')}

/* ---------- stock math ---------- */
function onHand(item,wh){let q=0;for(const l of list('ledger'))if(l.item===item&&(!wh||l.wh===wh))q+=n(l.qty);return q}
function avgCost(item){let q=0,v=0;for(const l of list('ledger'))if(l.item===item&&n(l.qty)>0){q+=n(l.qty);v+=n(l.qty)*n(l.rate)}return q?v/q:n(get('items',item)?.stdCost)}
function openPoQty(item){let q=0;for(const p of list('pos'))if(['Approved','Partially Received'].includes(p.status))for(const l of p.lines||[])if(l.item===item)q+=Math.max(0,n(l.qty)-n(l.recv));return q}
function docTotal(d){return (d.lines||[]).reduce((s,l)=>s+n(l.qty)*n(l.rate),0)}
function bomReq(d){const b=get('boms',d.bom);if(!b)return[];const f=n(d.qty)/(n(b.outQty)||1);
 return (b.lines||[]).filter(l=>l.item).map(l=>({item:l.item,qty:+(n(l.qty)*f*(1+n(l.scrap)/100)).toFixed(3)}))}
function batchBal(item,wh){const m={};for(const l of list('ledger'))if(l.item===item&&l.wh===wh){const b=l.batch||'';const r=(m[b]??={batch:b,qty:0,first:'9999',exp:''});r.qty+=n(l.qty);if(n(l.qty)>0){if(String(l.date)<r.first)r.first=l.date;if(l.exp)r.exp=l.exp}}
 return Object.values(m).filter(r=>r.qty>1e-9).sort((a,b)=>(a.exp||'9999').localeCompare(b.exp||'9999')||a.first.localeCompare(b.first))}
function alloc(item,wh,qty,pref){const bal=batchBal(item,wh);
 if(pref){const b=bal.find(x=>x.batch===pref);if(!b||b.qty<qty-1e-6)fail(`${item}: batch ${pref} has only ${q3(b?.qty||0)} in ${wh}.`);return [{batch:pref,qty,exp:b.exp}]}
 const tot=bal.reduce((s,b)=>s+b.qty,0);if(tot<qty-1e-6)fail(`${item}: only ${q3(tot)} in ${wh}, need ${q3(qty)}.`);
 const out=[];let left=qty;for(const b of bal){if(left<=1e-9)break;const t=Math.min(left,b.qty);out.push({batch:b.batch,qty:+t.toFixed(3),exp:b.exp});left-=t}return out}

/* ---------- GST ---------- */
const sameState=(a,b)=>a&&b&&String(a).toLowerCase()===String(b).toLowerCase();
function gstCalc(d){const intra=sameState(company.state,d.pos);let tx=0,tax=0;const rates={};
 for(const l of d.lines||[]){const t=n(l.qty)*n(l.rate),g=t*n(l.gst)/100;tx+=t;tax+=g;const k=n(l.gst);(rates[k]??={taxable:0,tax:0});rates[k].taxable+=t;rates[k].tax+=g}
 const gross=tx+tax,total=Math.round(gross);return {intra,taxable:tx,tax,cgst:intra?tax/2:0,sgst:intra?tax/2:0,igst:intra?0:tax,round:total-gross,total,rates}}
function words(num){const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
 const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:''),three=x=>(x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');
 let x=Math.floor(num),r='';const cr=Math.floor(x/1e7);x%=1e7;const lk=Math.floor(x/1e5);x%=1e5;const th=Math.floor(x/1e3);x%=1e3;
 if(cr)r+=three(cr)+' Crore ';if(lk)r+=two(lk)+' Lakh ';if(th)r+=two(th)+' Thousand ';if(x)r+=three(x);return 'Rupees '+(r.trim()||'Zero')+' Only'}

function shiftMin(){const [h,m]=String(company.shiftStart||'09:00').split(':').map(Number);return (h||0)*60+(m||0)}

const dayAt=(t,plus,min)=>new Date(t.getFullYear(),t.getMonth(),t.getDate()+plus,0,min);
function addWork(start,mins,hpd){let t=new Date(start),left=mins;const s0=shiftMin(),len=Math.max(1,Math.min(24,hpd||8))*60;
 for(let g=0;g<5000;g++){if(isOff(t)){t=dayAt(t,1,s0);continue}const m=t.getHours()*60+t.getMinutes();
  if(m<s0){t=dayAt(t,0,s0);continue}if(m>=s0+len){t=dayAt(t,1,s0);continue}
  const av=s0+len-m;if(left<=av)return t.getTime()+left*6e4;left-=av;t=dayAt(t,1,s0)}return t.getTime()}
function scheduleOps(d,from){const rt=get('routings',d.routing);if(!rt)return [];
 const busy={};for(const m of list('prods'))if(m.no!==d.no&&['Released','In Progress'].includes(m.status))for(const o of m.ops||[])if(o.status!=='Done')busy[o.wc]=Math.max(busy[o.wc]||0,n(o.end));
 const done=(d.ops||[]).filter(o=>o.status==='Done');let prev=Math.max(from,...done.map(o=>n(o.end)),0);
 const ops=[...done];
 for(const l of [...(rt.lines||[])].sort((a,b)=>n(a.seq)-n(b.seq))){if(done.some(o=>o.seq===n(l.seq)))continue;
  const wc=get('workcenters',l.wc),hpd=n(wc?.hoursDay)||8,mins=Math.max(1,Math.round(n(l.setup)+n(l.run)*n(d.qty)));
  const st=addWork(Math.max(prev,busy[l.wc]||0),0,hpd),en=addWork(st,mins,hpd);busy[l.wc]=en;prev=en;
  ops.push({seq:n(l.seq),op:l.op,wc:l.wc,mins,start:st,end:en,status:'Pending'})}
 return ops.sort((a,b)=>a.seq-b.seq)}
const allOps=()=>list('prods').filter(m=>['Released','In Progress','Finished'].includes(m.status)).flatMap(m=>(m.ops||[]).map(o=>({...o,mo:m.no,item:m.item,qty:m.qty,mst:m.status})));

function batchRows(){const m={},t=Date.parse(today()+'T00:00');for(const l of list('ledger')){const k=l.item+'|'+l.wh+'|'+(l.batch||'');const r=(m[k]??={item:l.item,wh:l.wh,batch:l.batch||'',qty:0,first:'',exp:''});r.qty+=n(l.qty);
  if(n(l.qty)>0){if(!r.first||l.date<r.first)r.first=l.date;if(l.exp&&(!r.exp||l.exp<r.exp))r.exp=l.exp}}
 return Object.values(m).filter(r=>r.qty>1e-9).map(r=>{const it=get('items',r.item)||{},age=r.first?Math.max(0,Math.round((t-Date.parse(r.first+'T00:00'))/DAYMS)):0,ed=r.exp?Math.round((Date.parse(r.exp+'T00:00')-t)/DAYMS):null;
  return {...r,name:it.name||'',uom:it.uom||'',age,bucket:BUCKETS.find(b=>age<=b[0])[1],ed,value:r.qty*avgCost(r.item)}}).sort((a,b)=>b.age-a.age)}

function planRows(){const need={};
 for(const m of list('prods'))if(['Created','Released'].includes(m.status))for(const r of bomReq(m))need[r.item]=(need[r.item]||0)+r.qty;
 for(const it of list('items'))if(it.active!==false&&n(it.reorder)>0&&!FG.includes(it.type))need[it.code]=need[it.code]||0;
 return Object.entries(need).map(([item,req])=>{const it=get('items',item)||{},oh=onHand(item),po=openPoQty(item),ro=n(it.reorder);
  const short=Math.max(0,req+ro-oh-po);return {item,name:it.name||'',uom:it.uom||'',req,oh,po,ro,short,rate:n(it.stdCost)}})
  .filter(r=>r.req>0||r.short>0).sort((a,b)=>b.short-a.short||a.item.localeCompare(b.item))}

 </div></div>`:'<div class="note">Add work centers and routings to see the machine schedule.</div>';

/* ---------- workflow actions ---------- */
const WF={
 pos:d=>[d.status==='Draft'&&['approve','Approve','a'],['Approved','Partially Received'].includes(d.status)&&['mkgrn','Create GRN','m:stores'],['Approved','Partially Received'].includes(d.status)&&['close','Close PO','a']],
 grns:d=>[d.status==='Draft'&&['post','Post GRN','e'],d.status==='Posted'&&!d.billed&&['mkpinv','Book purchase invoice','m:accounts']],
 prods:d=>[d.status==='Created'&&['release','Release to floor','a'],d.status==='Released'&&['issue','Issue materials','e'],['Released','In Progress'].includes(d.status)&&d.routing&&['resched','Reschedule','e'],d.status==='In Progress'&&['finish','Report as finished','e']],
 sos:d=>[d.status==='Draft'&&['confirm','Confirm','a'],['Confirmed','Partially Dispatched'].includes(d.status)&&['mkdn','Create dispatch','m:stores'],['Confirmed','Partially Dispatched'].includes(d.status)&&['mkmo','Create production order','m:production'],['Confirmed','Partially Dispatched'].includes(d.status)&&['close','Close SO','a']],

async function runWF(a){const v=st.view,label=(WF[v](st.draft).find(x=>x&&x[0]===a)||[])[1]||a;

const norm=s=>String(s??'').toLowerCase().replace(/[^a-z0-9]/g,'');
function flatHeaders(c){return [...c.fields.map(f=>f.l),...(c.lines||[]).map(f=>'Line - '+f.l)]}
function flatRows(v,recs){const c=ENT[v],out=[];
 for(const r of recs){const base={};for(const f of c.fields)base[f.l]=f.t==='bool'?(r[f.k]===true||(r[f.k]==null&&f.def!==false)?'Yes':'No'):f.t==='num'?(r[f.k]===''||r[f.k]==null?'':n(r[f.k])):(r[f.k]??'');
  if(c.lines&&(r.lines||[]).length)for(const l of r.lines){const o={...base};for(const f of c.lines)o['Line - '+f.l]=f.t==='num'||f.t==='ro'?(l[f.k]===''||l[f.k]==null?'':n(l[f.k])):(l[f.k]??'');out.push(o)}
  else out.push(base)}return out}
async function saveFile(name,data){const ext=name.split('.').pop();const type={csv:'text/csv',html:'text/html',json:'application/json',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}[ext]||'application/octet-stream';
 const b=data instanceof Blob?data:new Blob([data],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);toast('Downloaded '+name)}
function exportAoa(base,head,rows,fmtx,extra){if(!window.XLSX){toast('Excel library didn’t load. Check your connection and reload.',1);return}
 const ws=XLSX.utils.aoa_to_sheet([head,...rows]);ws['!cols']=head.map(h=>({wch:Math.max(10,String(h).length+2)}));
 const name=`${base}_${today()}.${fmtx}`;
 if(fmtx==='csv')return saveFile(name,'﻿'+XLSX.utils.sheet_to_csv(ws));
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,base.slice(0,31));if(extra)extra(wb);
 saveFile(name,new Uint8Array(XLSX.write(wb,{bookType:'xlsx',type:'array'})))}
function exportList(fmtx){const v=st.view,c=ENT[v];let h=flatHeaders(c),rs=rowsFor(v);
 if(c.gst){h=[...h,'Taxable (₹)','CGST (₹)','SGST (₹)','IGST (₹)','Invoice Total (₹)'];const fr=[];for(const r of rs){const g=gstCalc(r);for(const o of flatRows(v,[r]))fr.push({...o,'Taxable (₹)':+g.taxable.toFixed(2),'CGST (₹)':+g.cgst.toFixed(2),'SGST (₹)':+g.sgst.toFixed(2),'IGST (₹)':+g.igst.toFixed(2),'Invoice Total (₹)':g.total})}return exportAoa(v,h,fr.map(o=>h.map(k=>o[k]??'')),fmtx)}
 exportAoa(v,h,flatRows(v,rs).map(o=>h.map(k=>o[k]??'')),fmtx)}
const skipImp=f=>(f.t==='ro'&&f.k!=='no')||f.ro||f.stage;
function exportTemplate(){const v=st.view,c=ENT[v],h=[...c.fields.filter(f=>!skipImp(f)).map(f=>f.l),...(c.lines||[]).filter(f=>!skipImp(f)).map(f=>'Line - '+f.l)];
 exportAoa(v+'_template',h,[],'xlsx',wb=>{const notes=[['Column','Required','Allowed values / notes']];
  for(const f of c.fields.filter(f=>!skipImp(f)))notes.push([f.l,f.req?'Yes':'',f.t==='sel'?f.o.join(', '):f.t==='ref'?`Code from ${ENT[f.r].title}`:f.t==='bool'?'Yes / No':f.t==='date'?'Date (YYYY-MM-DD)':f.t==='num'?'Number':f.k==='no'?'Optional: leave blank to number automatically. Rows with the same number become one document.':''])
  for(const f of (c.lines||[]).filter(f=>!skipImp(f)))notes.push(['Line - '+f.l,f.req?'Yes':'',f.t==='ref'?`Code from ${ENT[f.r].title}. One row per line.`:f.t==='num'?'Number':f.t==='date'?'Date (YYYY-MM-DD)':'']);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(notes),'Instructions')})}
function exportReport(fmtx){const v=st.view;
 if(v==='stock'){let r=stockRows();if(st.filt)r=r.filter(x=>x.wh===st.filt);exportAoa('stock_on_hand',['Item Code','Item Name','Type','Warehouse','Qty','Unit','Avg Cost','Value'],r.map(x=>[x.item,x.name,x.type,x.wh,+x.qty.toFixed(3),x.uom,+x.rate.toFixed(2),+x.value.toFixed(2)]),fmtx)}
 if(v==='batches'){let r=batchRows();if(st.filt)r=r.filter(x=>x.wh===st.filt);exportAoa('batch_aging',['Item Code','Item Name','Batch','Warehouse','Qty','Unit','Received','Age (days)','Bucket','Expiry','Value'],r.map(x=>[x.item,x.name,x.batch,x.wh,+x.qty.toFixed(3),x.uom,x.first,x.age,x.bucket,x.exp,+x.value.toFixed(2)]),fmtx)}
 if(v==='ledger'){let r=ledgerRows();if(st.filt)r=r.filter(x=>x.wh===st.filt);exportAoa('stock_ledger',['Date','Type','Document','Item','Batch','Warehouse','Party','Qty','Rate','Value'],r.map(x=>[x.date,x.type,x.ref,x.item,x.batch||'',x.wh,x.party,n(x.qty),n(x.rate),n(x.value)]),fmtx)}
 if(v==='plan')exportAoa('material_planning',['Item Code','Item Name','Needed for MOs','Reorder Level','On Hand','On Open POs','To Purchase','Unit'],planRows().map(x=>[x.item,x.name,x.req,x.ro,x.oh,x.po,x.short,x.uom]),fmtx)}
function coerce(f,raw,errs,row){let v=raw;if(v instanceof Date){const d=new Date(v.getTime()-v.getTimezoneOffset()*60000);v=d.toISOString().slice(0,10)}
 v=typeof v==='string'?v.trim():v;if(v===''||v==null)return f.t==='bool'?(f.def!==false):'';
 if(f.t==='num'){if(!isFinite(parseFloat(String(v).replace(/,/g,''))))errs.push(`Row ${row}: “${f.l}” must be a number.`);return n(v)}
 if(f.t==='bool')return !['no','n','false','0','inactive'].includes(String(v).toLowerCase());
 if(f.t==='sel'){const o=f.o.find(o=>o.toLowerCase()===String(v).toLowerCase());if(!o)errs.push(`Row ${row}: “${v}” isn’t a valid ${f.l}.`);return o||''}
 if(f.t==='ref'){const s=String(v);if(!get(f.r,s))errs.push(`Row ${row}: ${f.l} “${s}” not found in ${ENT[f.r].title}.`);return s}
 if(f.t==='date'&&typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`}
 return String(v)}
async function importFile(file){const v=st.view,c=ENT[v];if(!window.XLSX){toast('Excel library didn’t load. Check your connection and reload.',1);return}
 let rows;try{const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})}catch(e){toast('Couldn’t read that file. Use .xlsx or .csv.',1);return}
 if(!rows.length){toast('The file has no data rows.',1);return}
 const map={};for(const h of Object.keys(rows[0])){const k=norm(h);let f=c.fields.find(f=>norm(f.l)===k||norm(f.k)===k);if(f){map[h]={f};continue}
  f=(c.lines||[]).find(f=>norm('Line - '+f.l)===k||norm('line'+f.k)===k||(!c.fields.some(x=>norm(x.l)===norm(f.l))&&norm(f.l)===k));if(f)map[h]={f,line:1}}
 const keyF=c.fields.find(f=>f.k===c.key),errs=[],docs={},order=[];
 if(!c.txn&&!Object.values(map).some(m=>m.f===keyF)){toast(`Column “${keyF.l}” is missing. Download the blank template to see the headings.`,1);return}
 rows.forEach((r,i)=>{const row=i+2,hd={},ln={};let any=false;
  for(const [h,m] of Object.entries(map)){if(skipImp(m.f))continue;const raw=r[h];if(raw!==''&&raw!=null)any=true;
   const val=m.f.k==='no'?String(raw??'').trim():coerce(m.f,raw,errs,row);(m.line?ln:hd)[m.f.k]=val}
  if(!any)return;let key=hd[c.key];if(!c.txn&&!key){errs.push(`Row ${row}: ${keyF.l} is empty.`);return}
  if(c.txn&&!key)key='__new'+row;
  if(!docs[key]){docs[key]={...hd,lines:[],_row:row};order.push(key)}
  if(c.lines&&(ln.item||ln.desc))docs[key].lines.push(ln)});
 let add=0,upd=0;const writes=[];
 for(const key of order){const d=docs[key],row=d._row;delete d._row;
  for(const f of c.fields)if(f.req&&f.t!=='bool'&&f.k!=='no'&&!String(d[f.k]??'').trim()&&f.def===undefined)errs.push(`Row ${row}: ${f.l} is required.`);
  if(!c.lines)delete d.lines;
  if(c.txn){if(key.startsWith('__new'))d.no=null;const ex=d.no?get(v,d.no):null;if(ex&&ex.status!=='Draft'){errs.push(`Row ${row}: ${d.no} is ${ex.status} and can’t be overwritten.`);continue}
   for(const f of c.fields)if(f.def!==undefined&&!d[f.k])d[f.k]=typeof f.def==='function'?f.def():f.def;d.status=c.fields.find(f=>f.k==='status').def;d.createdBy=me.id||'';d.createdAt=Date.now();d.log=[{at:Date.now(),by:me.id||'',act:'Imported'}];writes.push(d)}
  else{const ex=get(v,d[c.key]);for(const f of c.fields)if(f.t==='bool'&&!(f.k in d))d[f.k]=ex?ex[f.k]:f.def!==false;if(c.lines&&!d.lines.length&&ex)d.lines=ex.lines;writes.push(ex?{...ex,...d}:d);ex?upd++:add++}}
 if(errs.length){modal(`<h2>Import stopped — ${errs.length} problem${errs.length>1?'s':''} found</h2><p class="muted">Nothing was saved. Fix these rows in your file and import again.</p><ul>${errs.slice(0,25).map(e=>`<li>${esc(e)}</li>`).join('')}</ul>${errs.length>25?`<p class="muted">…and ${errs.length-25} more.</p>`:''}<div class="acts"><button class="btn pri" data-act="mclose">OK</button></div>`);return}
 modal(`<h2>Importing ${writes.length} record${writes.length>1?'s':''}…</h2><p class="muted" id="iprog">Saving 0 of ${writes.length}</p>`);
 let done=0;try{for(let i=0;i<writes.length;i+=8){await Promise.all(writes.slice(i,i+8).map(async d=>{if(c.txn){if(!d.no){d.no=docNo(c,v,d);S[v][sid(d.no)]=d}add++}d.updatedAt=Date.now();await put(v,sid(d[c.key]),d);done++}));const p=$('#iprog');if(p)p.textContent=`Saving ${done} of ${writes.length}`}}
 catch(e){modal(`<h2>Import interrupted</h2><p>${done} of ${writes.length} records were saved before an error: ${esc(e?.message||e)}</p><div class="acts"><button class="btn pri" data-act="mclose">OK</button></div>`);render();return}
 modal(`<h2>Import complete</h2><p>${c.txn?`${writes.length} draft document${writes.length>1?'s':''} created or updated.`:`${add} added, ${upd} updated.`}</p><div class="acts"><button class="btn pri" data-act="mclose">Done</button></div>`);render()}

function connectWS(){clearTimeout(wsTimer);const p=location.protocol==='https:'?'wss':'ws';const sock=new WebSocket(`${p}://${location.host}/ws`);ws=sock;
 sock.onopen=()=>{if(wsTry>0)loadAll().catch(()=>{});wsTry=0;stale=false;renderChrome()};
 sock.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
  if(m.t==='doc'){if(m.c==='settings'){if(m.id==='company')company=m.d||{}}else if(S[m.c]){if(m.d==null)delete S[m.c][m.id];else S[m.c][m.id]=m.d}schedule()}
  if(m.t==='users')refreshUsers()};
 sock.onclose=e=>{if(ws!==sock)return;ws=null;if(e.code===4001){API.j('GET','/api/me').catch(()=>{});return}
  stale=true;renderChrome();wsTimer=setTimeout(connectWS,e.code===4002?200:Math.min(30000,1000*2**(wsTry++)))}}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('#lbtn');btn.disabled=true;$('#lerr').textContent='';
 try{const r=await API.j('POST','/api/login',{email:$('#lemail').value.trim(),password:$('#lpass').value});$('#lpass').value='';setMe(r.user);await loadAll();wsTry=0;connectWS();route()}
 catch(x){$('#lerr').textContent=x.message||'Sign-in failed.'}finally{btn.disabled=false}});
/* ---------- mobile app (PWA) ---------- */
let installEvt=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;$('#installBtn').hidden=false});
window.addEventListener('appinstalled',()=>{installEvt=null;$('#installBtn').hidden=true;toast('Gopin ERP installed')});
if(isIOS&&!standalone())$('#installBtn').hidden=false;
$('#installBtn').addEventListener('click',async()=>{
 if(installEvt){installEvt.prompt();await installEvt.userChoice.catch(()=>{});installEvt=null;$('#installBtn').hidden=true;return}
 modal(`<h2>Install on iPhone / iPad</h2><ol style="padding-left:18px;line-height:1.9;margin:0"><li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button (square with an arrow).</li><li>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol><div class="acts"><button class="btn pri" data-act="mclose">OK</button></div>`)});
// Phones pause the connection in the background; catch up as soon as the app is opened again.
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&me.id&&(!ws||ws.readyState>1)){wsTry=0;loadAll().catch(()=>{});connectWS()}});

route();
(async()=>{try{const r=await API.j('GET','/api/me');setMe(r.user);await loadAll();connectWS()}catch(e){if(e.code!=='unauth'){$('#login').hidden=false;$('#lerr').textContent=e.message}}})();
</script>
</body>
</html>
