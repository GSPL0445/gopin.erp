/* ---------- helpers ---------- */

/* ---------- reference data ---------- */

// machine-hour rate: (depreciation + maintenance + power + utilities) per machine × machines + labour, plus overhead
function wcCalc(d){d=d||{};const m=n(d.machines)||1,hDay=(n(d.shifts)&&n(d.hoursShift))?n(d.shifts)*n(d.hoursShift):(n(d.hoursDay)||24),dm=n(d.daysMonth)||30,yrH=hDay*dm*12,oee=(n(d.oee)||100)/100;
 const dep=yrH?n(d.assetValue)/(n(d.lifeYears)||7)/yrH:0,mnt=yrH?n(d.assetValue)*n(d.maintPct)/100/yrH:0,pow=n(d.kw)*n(d.kwhRate),utl=n(d.utilHr),lab=n(d.operators)*n(d.labourHr);
 const has=!!(n(d.assetValue)||n(d.kw)||n(d.utilHr)||n(d.operators)),base=m*(dep+mnt+pow+utl)+lab,oh=base*n(d.ohPct)/100;
 const costHr=has?base+oh:n(d.costHr),capHr=n(d.uph)?m*n(d.uph)*oee:n(d.capHr),conv=capHr?costHr/capHr:0;
 return {m,hDay,dm,yrH,dep:m*dep,mnt:m*mnt,pow:m*pow,utl:m*utl,lab,oh,has,costHr,capHr,conv,cons:n(d.consWafer),costWafer:conv+n(d.consWafer),monthCap:capHr*hDay*dm}}
function wcBeforeSave(d){const w=wcCalc(d);if(n(d.shifts)&&n(d.hoursShift))d.hoursDay=w.hDay;if(w.has)d.costHr=+w.costHr.toFixed(2);if(n(d.uph))d.capHr=+w.capHr.toFixed(1);d.costWafer=+w.costWafer.toFixed(4);d.monthCap=Math.round(w.monthCap)}

 ${r('Power / hr',fmt(w.pow),`${n(d.kw)} kW × ₹${n(d.kwhRate)} × ${w.m}`)}${r('Utilities / hr',fmt(w.utl))}${r('Labour / hr',fmt(w.lab),`${n(d.operators)} operator(s) × ₹${n(d.labourHr)}`)}
 ${r('Overhead / hr',fmt(w.oh),`${n(d.ohPct)}%`)}<tr class="tot">${`<td>Machine-hour rate (₹ / hr)</td><td class="num">${fmt(w.costHr)}</td><td class="muted">${w.has?'calculated':'entered manually'}</td>`}</tr>
 ${r('Effective capacity (wafers / hr)',q3(w.capHr),n(d.uph)?`${w.m} × ${n(d.uph)} UPH × ${n(d.oee)||100}% OEE`:'entered manually')}${r('Capacity (wafers / month)',Math.round(w.monthCap).toLocaleString('en-IN'))}
 ${r('Conversion cost / wafer',rs4(w.conv))}${r('Consumables / wafer',rs4(w.cons))}<tr class="tot"><td>Cost / wafer at this work center</td><td class="num">${rs4(w.costWafer)}</td><td></td></tr>
 </tbody></table></div>`}
// one routing operation: conversion (machine-hour rate ÷ effective UPH) + consumables, per wafer
function opCost(l){const wc=get('workcenters',l.wc);if(!wc)return null;const w=wcCalc(wc),cons=l.cons!==''&&l.cons!=null?n(l.cons):w.cons;return {wc,w,conv:w.conv,cons,total:w.conv+cons,yield:(l.yield===''||l.yield==null?100:n(l.yield))/100}}
function rtgCalc(d){const cpw=n(d.cellsPerWafer)||1,ops=[];let cum=1,conv=0,cons=0,bott=null;
 for(const l of [...(d.lines||[])].sort((a,b)=>n(a.seq)-n(b.seq))){const c=opCost(l);if(!c){ops.push({l,c:null,cum});continue}cum*=c.yield;conv+=c.conv;cons+=c.cons;ops.push({l,c,cum});
  if(c.w.capHr&&(!bott||c.w.monthCap<bott.c.w.monthCap))bott={l,c}}
 const b=bomOf(d.item),mat=b?(b.lines||[]).reduce((t,x)=>t+n(x.qty)*(avgCost(x.item)||n(get('items',x.item)?.stdCost)),0)/(n(b.outQty)||1):0;
 const area=WAFER_AREA[d.waferSize]||0,wp=n(d.wp)||(area&&n(d.effTarget)?area*n(d.effTarget)/100*1000/cpw:0);
 const cell=cum>0?(mat+(conv+cons)/cpw)/cum:0,wafersMo=bott?bott.c.w.monthCap:0,cellsMo=wafersMo*cpw*cum;
 return {cpw,ops,cum,conv,cons,bom:b,mat,wp,cell,perWp:wp?cell/wp:0,bott,wafersMo,cellsMo,mw:cellsMo*wp/1e6}}
function moCostHTML(d){const rt=get('routings',d.routing),rc=rt?rtgCalc(rt):null,k=(l,v,h)=>`<div class="kpi"><span>${l}</span><b>${v}</b>${h?`<small>${h}</small>`:''}</div>`;
 if(d.status==='Finished'&&d.unitCost!=null)return `<div class="kpis">${k('Material consumed',inr(d.matCost??d.issuedValue))}${k('Conversion (routing)',inr(d.convCost||0),rc?`${q3((n(d.goodQty)+n(d.scrapQty))/rc.cpw)} wafers × ${rs4(rc.conv+rc.cons)}`:'No routing')}

 if(!rc)return '<p class="muted">Select a routing to see the estimated cost. Actual cost is shown after “Report as finished”.</p>';

 return `<div class="tablewrap"><table class="cs"><thead><tr><th>Op</th><th>Operation</th><th>Work Center</th><th class="num">Eff. wafers / hr</th><th class="num">Conversion ₹/wafer</th><th class="num">Consumables ₹/wafer</th><th class="num">Total ₹/wafer</th><th class="num">Step yield</th><th class="num">Cum. yield</th></tr></thead>

 <div class="kpis">${k('Material / cell (BOM)',rs4(r.mat),r.bom?`BOM ${esc(r.bom.code)} at average / standard cost`:'No active BOM for this item')}${k('Conversion + consumables / cell',rs4((r.conv+r.cons)/r.cpw),`${r.cpw} cell(s) per wafer`)}
 ${k('Cost per good cell',rs4(r.cell),`after ${pc(r.cum)} line yield`)}${k('Power per cell',r.wp?q3(r.wp)+' Wp':'—',n(d.wp)?'entered':(r.wp?`${n(d.effTarget)}% × ${WAFER_AREA[d.waferSize]} m²`:'enter efficiency & wafer size'))}

 <p class="hint">Conversion ₹/wafer = work center machine-hour rate ÷ effective wafers per hour. Cost per good cell = (BOM material + conversion and consumables per cell) ÷ cumulative yield. Keep pastes and chemicals either in the BOM or as routing consumables, not both.</p>`}

/* ---------- stock math ---------- */
function onHand(item,wh){let q=0;for(const l of list('ledger'))if(l.item===item&&(!wh||l.wh===wh))q+=n(l.qty);return q}
function avgCost(item){let q=0,v=0;for(const l of list('ledger'))if(l.item===item&&n(l.qty)>0){q+=n(l.qty);v+=n(l.qty)*n(l.rate)}return q?v/q:n(get('items',item)?.stdCost)}
function openPoQty(item){let q=0;for(const p of list('pos'))if(['Approved','Partially Received'].includes(p.status))for(const l of p.lines||[])if(l.item===item)q+=Math.max(0,n(l.qty)-n(l.recv));return q}
function docTotal(d){return (d.lines||[]).reduce((s,l)=>s+n(l.qty)*n(l.rate),0)}
function bomReq(d){const b=get('boms',d.bom);if(!b)return[];const f=n(d.qty)/(n(b.outQty)||1);
 return (b.lines||[]).filter(l=>l.item).map(l=>({item:l.item,qty:+(n(l.qty)*f*(1+n(l.scrap)/100)).toFixed(3)}))}
// Stock is kept per item + warehouse + batch + supplier (l.sup; older entries have none).
function batchBal(item,wh){const m={};for(const l of list('ledger'))if(l.item===item&&l.wh===wh){const b=l.batch||'',sp=l.sup||'';const r=(m[b+'|'+sp]??={batch:b,sup:sp,qty:0,first:'9999',exp:''});r.qty+=n(l.qty);if(n(l.qty)>0){if(String(l.date)<r.first)r.first=l.date;if(l.exp)r.exp=l.exp}}
 return Object.values(m).filter(r=>r.qty>1e-9).sort((a,b)=>(a.exp||'9999').localeCompare(b.exp||'9999')||a.first.localeCompare(b.first))}
const batchQty=(item,wh,batch,sup)=>batchBal(item,wh).filter(x=>(!batch||x.batch===batch)&&(!sup||x.sup===sup)).reduce((t,x)=>t+x.qty,0);
// Take qty out FEFO / FIFO, optionally only from one batch and / or one supplier's stock.
function alloc(item,wh,qty,pref,sup){if(!isStocked(item))return [{batch:'',sup:sup||'',qty,exp:''}];
 const bal=batchBal(item,wh).filter(x=>(!pref||x.batch===pref)&&(!sup||x.sup===sup)),tot=bal.reduce((s,b)=>s+b.qty,0);
 if(tot<qty-1e-6)fail(`${item}${pref?' batch '+pref:''}${sup?' from '+sup:''}: only ${q3(tot)} in ${wh}, need ${q3(qty)}.`);
 const out=[];let left=qty;for(const b of bal){if(left<=1e-9)break;const t=Math.min(left,b.qty);out.push({batch:b.batch,sup:b.sup,qty:+t.toFixed(3),exp:b.exp});left-=t}return out}

const sameState=(a,b)=>a&&b&&String(a).toLowerCase()===String(b).toLowerCase();
function gstCalc(d){const zero=d.pos===EXPORT_ST?'export':d.pos===IMPORT_ST?'import':'',intra=!zero&&sameState(company.state,d.pos);let tx=0,tax=0;const rates={};
 for(const l of d.lines||[]){const t=n(l.qty)*n(l.rate),g=zero?0:t*n(l.gst)/100;tx+=t;tax+=g;const k=n(l.gst);(rates[k]??={taxable:0,tax:0});rates[k].taxable+=t;rates[k].tax+=g}
 const gross=tx+tax,total=Math.round(gross);return {zero,intra,taxable:tx,tax,cgst:intra?tax/2:0,sgst:intra?tax/2:0,igst:intra?0:tax,round:total-gross,total,rates}}
function words(num){const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
 const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:''),three=x=>(x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');
 let x=Math.floor(num),r='';const cr=Math.floor(x/1e7);x%=1e7;const lk=Math.floor(x/1e5);x%=1e5;const th=Math.floor(x/1e3);x%=1e3;
 if(cr)r+=three(cr)+' Crore ';if(lk)r+=two(lk)+' Lakh ';if(th)r+=two(th)+' Thousand ';if(x)r+=three(x);return 'Rupees '+(r.trim()||'Zero')+' Only'}

/* ---------- scheduling ---------- */
function shiftMin(){const [h,m]=String(company.shiftStart||'09:00').split(':').map(Number);return (h||0)*60+(m||0)}
const isOff=t=>(company.weeklyOff||'Sunday')==='Sunday'&&t.getDay()===0;
const dayAt=(t,plus,min)=>new Date(t.getFullYear(),t.getMonth(),t.getDate()+plus,0,min);
function addWork(start,mins,hpd){let t=new Date(start),left=mins;const s0=shiftMin(),len=Math.max(1,Math.min(24,hpd||8))*60;
 for(let g=0;g<5000;g++){if(isOff(t)){t=dayAt(t,1,s0);continue}const m=t.getHours()*60+t.getMinutes();
  if(m<s0){t=dayAt(t,0,s0);continue}if(m>=s0+len){t=dayAt(t,1,s0);continue}
  const av=s0+len-m;if(left<=av)return t.getTime()+left*6e4;left-=av;t=dayAt(t,1,s0)}return t.getTime()}
function scheduleOps(d,from){const rt=get('routings',d.routing);if(!rt)return [];
 const busy={};for(const m of list('prods'))if(m.no!==d.no&&['Released','In Progress'].includes(m.status))for(const o of m.ops||[])if(o.status!=='Done')busy[o.wc]=Math.max(busy[o.wc]||0,n(o.end));
 const done=(d.ops||[]).filter(o=>o.status==='Done');let prev=Math.max(from,...done.map(o=>n(o.end)),0);
 const ops=[...done];
 for(const l of [...(rt.lines||[])].sort((a,b)=>n(a.seq)-n(b.seq))){if(done.some(o=>o.seq===n(l.seq)))continue;
  const wc=get('workcenters',l.wc),hpd=n(wc?.hoursDay)||8,mins=Math.max(1,Math.round(n(l.setup)+n(l.run)*n(d.qty)));
  const st=addWork(Math.max(prev,busy[l.wc]||0),0,hpd),en=addWork(st,mins,hpd);busy[l.wc]=en;prev=en;
  ops.push({seq:n(l.seq),op:l.op,wc:l.wc,mins,start:st,end:en,status:'Pending'})}
 return ops.sort((a,b)=>a.seq-b.seq)}
const allOps=()=>list('prods').filter(m=>['Released','In Progress','Finished'].includes(m.status)).flatMap(m=>(m.ops||[]).map(o=>({...o,mo:m.no,item:m.item,qty:m.qty,mst:m.status})));

  for(const q of list('qcs').filter(q=>q.ref===d.no&&q.source==='GRN')){const x=clone(q);let ch=false;for(const l of x.lines||[])if(rate[key(l)]!=null&&n(l.rate)!==rate[key(l)]){l.rate=rate[key(l)];ch=true}
   if(ch){await put('qcs',sid(x.no),x);for(const [id,l] of Object.entries(S.ledger||{}))if(l.ref===x.no&&rate[key(l)]!=null&&n(l.rate)!==rate[key(l)])await put('ledger',id,{...l,rate:rate[key(l)],value:+(n(l.qty)*rate[key(l)]).toFixed(2)})}}}
 const x=clone(d);x.grand=gstCalc(x).total;const what=[['docType','document type'],['invNo','document no.'],['invDate','document date'],['ewb','e-way bill no.'],['vehicle','vehicle no.'],['remarks','remarks']].filter(([k])=>(old[k]||'')!==(x[k]||'')).map(([,l])=>l);if(changed)what.push('rates');

function coerce(f,raw,errs,row){let v=raw;
 if(f.t==='time'&&v!==''&&v!=null){if(v instanceof Date)return String(v.getUTCHours()).padStart(2,'0')+':'+String(v.getUTCMinutes()).padStart(2,'0');if(typeof v==='number'){const m=Math.round((v%1)*1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
  const m=String(v).match(/(\d{1,2})[:.](\d{2})(?:[:.]\d{2})?\s*(am|pm)?/i);if(!m){errs.push(`Row ${row}: “${v}” isn’t a time (HH:MM).`);return ''}let h=+m[1];if(m[3]){const pm=m[3].toLowerCase()==='pm';if(pm&&h<12)h+=12;if(!pm&&h===12)h=0}return String(h).padStart(2,'0')+':'+m[2]}if(v instanceof Date){const d=new Date(v.getTime()-v.getTimezoneOffset()*60000);v=d.toISOString().slice(0,10)}
 v=typeof v==='string'?v.trim():v;if(v===''||v==null)return f.t==='bool'?(f.def!==false):'';
 if(f.t==='num'){if(!isFinite(parseFloat(String(v).replace(/,/g,''))))errs.push(`Row ${row}: “${f.l}” must be a number.`);return n(v)}
 if(f.t==='bool')return !['no','n','false','0','inactive'].includes(String(v).toLowerCase());
 if(f.t==='multi'){const out=[];for(const x of String(v).split(/[,;\n]/).map(x=>x.trim()).filter(Boolean)){const o=f.o.find(o=>o.toLowerCase()===x.toLowerCase());if(o)out.push(o);else errs.push(`Row ${row}: “${x}” isn’t a valid ${f.l}.`)}return out}
 if(f.t==='sel'){const o=f.o.find(o=>o.toLowerCase()===String(v).toLowerCase());if(!o)errs.push(`Row ${row}: “${v}” isn’t a valid ${f.l}.`);return o||''}
 if(f.t==='ref'){const s=String(v),k=refFind(f.r,s);if(k&&k.many){errs.push(`Row ${row}: ${f.l} “${s}” matches ${k.many} records in ${ENT[f.r].title}. Pick it from the drop-down (it adds the code).`);return s}
  if(!k&&f.soft&&IMP_PEND){const p={pend:s.trim(),row,f};IMP_PEND.push(p);return p}
  if(!k)errs.push(`Row ${row}: ${f.l} “${s}” not found in ${ENT[f.r].title}.`);return k||s}
 if(f.t==='date'&&typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`}
 return String(v)}
async function importFile(file){const v=st.view,c=ENT[v];if(!window.XLSX){toast('Excel library didn’t load. Check your connection and reload.',1);return}
 if(!/\.(xlsx|xlsm|xls)$/i.test(file.name)){toast('Please import an Excel file (.xlsx or .xls). Download the import template to start.',1);return}
 let rows;try{const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})}catch(e){toast('Couldn’t read that Excel file. Save it as .xlsx and try again.',1);return}
 if(!rows.length){toast('The file has no data rows.',1);return}
 const map={};for(const h of Object.keys(rows[0])){const k=norm(h);let f=c.fields.find(f=>norm(f.l)===k||norm(f.k)===k);if(f){map[h]={f};continue}
  f=(c.lines||[]).find(f=>norm('Line - '+f.l)===k||norm('line'+f.k)===k||(!c.fields.some(x=>norm(x.l)===norm(f.l))&&norm(f.l)===k));if(f)map[h]={f,line:1}}
 const keyF=c.fields.find(f=>f.k===c.key),errs=[],docs={},order=[];
 if(!c.txn&&!c.auto&&!Object.values(map).some(m=>m.f===keyF)){toast(`Column “${keyF.l}” is missing. Download the blank template to see the headings.`,1);return}
 let autoN=null,lastKey=null;IMP_PEND=[];const warns=[];
 rows.forEach((r,i)=>{const row=i+2,hd={},ln={},hg=new Set(),lg=new Set();let any=false;
  for(const [h,m] of Object.entries(map)){if(skipImp(m.f))continue;const raw=r[h];if(raw==null||String(raw).trim()==='')continue;any=true;
   const val=m.f.k==='no'?String(raw??'').trim():coerce(m.f,raw,errs,row);(m.line?ln:hd)[m.f.k]=val;(m.line?lg:hg).add(m.f.k)}
  if(!any)return;let key=hd[c.key];if(!c.txn&&!key&&c.auto){key=hd[c.key]=genNo(v,hd,autoN||(autoN={}))}if(!c.txn&&!key){errs.push(`Row ${row}: ${keyF.l} is empty.`);return}
  // documents: a row with only line columns filled continues the document above it
  if(c.txn&&!key)key=!hg.size&&lastKey?lastKey:'__new'+row;lastKey=key;
  if(!docs[key]){docs[key]={...hd,lines:[],_row:row,_given:hg};order.push(key)}
  if(c.lines&&lg.size){Object.defineProperty(ln,'_given',{value:lg});docs[key].lines.push(ln)}});
 // optional links not in the system yet: match a row of this same file, else leave blank and warn
 {const inFile=order.map(k=>docs[k]);for(const d of inFile)for(const [k,x] of Object.entries(d))if(x&&typeof x==='object'&&'pend' in x){const q=x.pend,hit=inFile.find(o=>o!==d&&(String(o[c.key]||'').toLowerCase()===q.toLowerCase()||bareName(o.name)===bareName(q)));
   if(hit&&hit[c.key])d[k]=String(hit[c.key]);else{d[k]='';warns.push(`Row ${x.row}: ${x.f.l} “${q}” not found — left blank. Set it later in the form.`)}}}
 IMP_PEND=null;
 let add=0,upd=0;const writes=[];
 for(const key of order){const d=docs[key],row=d._row,given=d._given;delete d._row;delete d._given;
  const exR=c.txn?(d.no?get(v,d.no):null):get(v,d[c.key]);
  {const be=backDateErr(v,d,exR);if(be)errs.push(`Row ${row}: ${be}`)}
  if(c.txn){const se=reqStockErr(v,d);if(se)errs.push(`Row ${row}: ${se}`)}
  if(v==='supcodes'&&d.supplier&&d.item){const dup=list('supcodes').find(x=>x.supplier===d.supplier&&x.item===d.item&&x.id!==d.id);if(dup)errs.push(`Row ${row}: ${d.item} already has a code for ${d.supplier} (${dup.id}). Put ${dup.id} in Mapping ID to update it.`)}
  if(v==='suppliers'&&d.stype==='Import'&&!d.state)d.state=IMPORT_ST;
  if(v==='suppliers'&&d.stype&&d.state&&(d.stype==='Import')!==isForeign(d.state))errs.push(`Row ${row}: Supplier Type “${d.stype}” doesn’t match State “${d.state}”.`);
  for(const f of c.fields)if(f.req&&f.t!=='bool'&&f.k!=='no'&&!String(d[f.k]??exR?.[f.k]??'').trim()&&f.def===undefined)errs.push(`Row ${row}: ${f.l} is required.`);
  if(v==='items'){const ge=groupErr({type:d.type??exR?.type,group:d.group??exR?.group,subgroup:d.subgroup??(d.group!=null&&d.group!==exR?.group?'':exR?.subgroup)});if(ge)errs.push(`Row ${row}: ${ge}`)}
  if((v==='suppliers'||v==='customers')&&!isForeign(d.state)&&!String(d.country||'').trim())d.country='India';
  if((v==='suppliers'||v==='customers')&&isForeign(d.state)&&/^\s*india\s*$/i.test(d.country||'India'))errs.push(`Row ${row}: State is “${d.state}” — enter the Country.`);
  if(!c.lines)delete d.lines;
  if(c.txn){if(key.startsWith('__new'))d.no=null;const ex=d.no?get(v,d.no):null;if(ex&&ex.status!=='Draft'){errs.push(`Row ${row}: ${d.no} is ${ex.status} and can’t be overwritten.`);continue}
   for(const f of c.fields)if(f.def!==undefined&&!d[f.k])d[f.k]=typeof f.def==='function'?f.def():f.def;fillLinked(v,c,d,given);d.status=c.fields.find(f=>f.k==='status').def;d.createdBy=me.id||'';d.createdAt=Date.now();d.log=[{at:Date.now(),by:me.id||'',act:'Imported'}];writes.push(d)}
  else{const ex=get(v,d[c.key]);if(!ex)for(const f of c.fields){if(f.k in d)continue;if(f.t==='bool')d[f.k]=f.def!==false;else if(f.def!==undefined)d[f.k]=typeof f.def==='function'?f.def():f.def}
   if(c.lines&&!d.lines.length&&ex)d.lines=ex.lines;const rec=ex?{...ex,...d}:d;fillLinked(v,c,rec,given);writes.push(rec);ex?upd++:add++}}
 if(errs.length){modal(`<h2>Import stopped — ${errs.length} problem${errs.length>1?'s':''} found</h2><p class="muted">Nothing was saved. Fix these rows in your file and import again.</p><ul>${errs.slice(0,25).map(e=>`<li>${esc(e)}</li>`).join('')}</ul>${errs.length>25?`<p class="muted">…and ${errs.length-25} more.</p>`:''}<div class="acts"><button class="btn pri" data-act="mclose">OK</button></div>`);return}
 modal(`<h2>Importing ${writes.length} record${writes.length>1?'s':''}…</h2><p class="muted" id="iprog">Saving 0 of ${writes.length}</p>`);
 let done=0;try{for(let i=0;i<writes.length;i+=8){await Promise.all(writes.slice(i,i+8).map(async d=>{if(c.txn){if(!d.no){d.no=docNo(c,v,d);S[v][sid(d.no)]=d}add++}d.updatedAt=Date.now();await put(v,sid(d[c.key]),d);done++}));const p=$('#iprog');if(p)p.textContent=`Saving ${done} of ${writes.length}`}}
 catch(e){modal(`<h2>Import interrupted</h2><p>${done} of ${writes.length} records were saved before an error: ${esc(e?.message||e)}</p><div class="acts"><button class="btn pri" data-act="mclose">OK</button></div>`);render();return}
 modal(`<h2>Import complete</h2><p>${c.txn?`${writes.length} draft document${writes.length>1?'s':''} created or updated.`:`${add} added, ${upd} updated.`}</p>${warns.length?`<p class="muted">${warns.length} note${warns.length>1?'s':''} — saved anyway:</p><ul>${warns.slice(0,25).map(w=>`<li>${esc(w)}</li>`).join('')}</ul>${warns.length>25?`<p class="muted">…and ${warns.length-25} more.</p>`:''}`:''}<div class="acts"><button class="btn pri" data-act="mclose">Done</button></div>`);render()}

/* Import: fill the details that come from linked masters, the same way the form does when you pick a value
   (item type / group → GST slab, HSN, QC, inventory; party → country; line item → unit, HSN, GST, rate).
   Anything typed in the Excel file wins over the linked value. */
function fillLinked(v,c,d,given){given=given||new Set();const keep={};for(const k of given)keep[k]=d[k];
 const ul=(d.lines||[]).slice();
 for(const f of c.fields)if(given.has(f.k)&&!f.ro)onField0(v,f.k,d);
 if(ul.length)d.lines=ul;                                   // lines typed in the file stay as they are
 for(const k of given)d[k]=keep[k];
 if(v==='items'&&(given.has('type')||given.has('group')||given.has('subgroup'))){const g={...d};applyGroup(g);for(const k of ['gst','hsn','qc'])if(!given.has(k)&&g[k]!==undefined)d[k]=g[k]}
 for(const l of d.lines||[]){const lg=l._given||new Set();if(!l.item)continue;const it=get('items',l.item);if(!it)continue;
  const lk=new Set((c.lines||[]).map(f=>f.k)),put1=(k,val)=>{if(lk.has(k)&&!lg.has(k)&&val!==undefined&&val!=='')l[k]=val};
  put1('uom',it.uom);put1('hsn',it.hsn);put1('gst',it.gst);put1('desc',it.name);
  if(!lg.has('rate'))onLine(v,'item',l)}}

 if(t.dataset.k){d[t.dataset.k]=t.type==='checkbox'?t.checked:t.value;if((t.tagName==='SELECT'||t.type==='date'||(t.type==='checkbox'&&ENT[st.view]?.fields.some(f=>f.when))||LIVE_K[st.view]?.includes(t.dataset.k))&&(onField(st.view,t.dataset.k,d)|(t.type==='checkbox')|(['supplier','wh','fromWh'].includes(t.dataset.k)&&(ENT[st.view].lines||[]).some(f=>f.calc)))){const y=scrollY;render();scrollTo(0,y)}return}
 if(t.dataset.li!=null&&t.tagName==='SELECT'){const l=d.lines[+t.dataset.li];l[t.dataset.lk]=t.value;onLine(st.view,t.dataset.lk,l);const y=scrollY;render();scrollTo(0,y)}});

V.addEventListener('submit',async e=>{if(e.target.id!=='uform')return;e.preventDefault();if(BUSY.n)return;withBusy(async()=>{
 const b=readUserForm('nu',e.target);
 try{await API.j('POST','/api/users',b);e.target.reset();document.activeElement?.blur();toast(`${b.name} added`);await refreshUsers();render()}catch(x){toast(x.message,1)}},'Saving…')});
$('#nav').addEventListener('click',async e=>{const mb=e.target.closest('[data-menu]');if(mb){st.menu=st.menu===mb.dataset.menu?null:mb.dataset.menu;renderChrome();return}
 if(e.target.closest('.mdd a')){st.menu=null;$('#nav').classList.remove('open');$('#menus').classList.add('picked')}

// Employee photo: centre-crop to a square, 192 px JPEG (~10 KB)
function shrinkPhoto(file){return new Promise((ok,no)=>{if(!/^image\//.test(file.type))return no(new Error('Choose an image file (JPG or PNG).'));if(file.size>15e6)return no(new Error('That image is over 15 MB. Choose a smaller file.'));
 const rd=new FileReader();rd.onerror=()=>no(new Error('Could not read that image.'));rd.onload=()=>{const img=new Image();img.onerror=()=>no(new Error('Could not read that image.'));img.onload=()=>{
  const W=img.naturalWidth,H=img.naturalHeight,m=Math.min(W,H),S=192,cv=document.createElement('canvas');cv.width=S;cv.height=S;const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,S,S);
  g.drawImage(img,(W-m)/2,Math.max(0,(H-m)/2-(H>W?(H-m)*0.15:0)),m,m,0,0,S,S);ok(cv.toDataURL('image/jpeg',.82))};img.src=rd.result};rd.readAsDataURL(file)})}
// avatar: employee photo, else initials
function avHTML(e,name,cls='av'){return e?.photo?`<span class="${cls} pic"><img src="${esc(e.photo)}" alt=""></span>`:`<span class="${cls}">${esc(initials(name||e?.name||''))}</span>`}
// Shrink an uploaded logo so it stays small (max 400×200, PNG keeps transparency).
function shrinkLogo(file){return new Promise((ok,no)=>{if(!/^image\//.test(file.type))return no(new Error('Choose an image file (PNG or JPG).'));if(file.size>8e6)return no(new Error('That image is over 8 MB. Choose a smaller file.'));
 const rd=new FileReader();rd.onerror=()=>no(new Error('Could not read that image.'));rd.onload=()=>{const img=new Image();img.onerror=()=>no(new Error('Could not read that image.'));img.onload=()=>{
  const k=Math.min(1,400/(img.naturalWidth||400),200/(img.naturalHeight||200)),w=Math.max(1,Math.round((img.naturalWidth||400)*k)),h=Math.max(1,Math.round((img.naturalHeight||200)*k));
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);let u=cv.toDataURL('image/png');
  if(u.length>350000){const c2=document.createElement('canvas');c2.width=w;c2.height=h;const g=c2.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);u=c2.toDataURL('image/jpeg',.85)}ok(u)};img.src=rd.result};rd.readAsDataURL(file)})}

/* ---------- sign-in, data load and live updates ---------- */
let ws=null,wsTry=0,wsTimer=0;
function showLogin(msg){if(ws){ws.onclose=null;try{ws.close()}catch(e){}ws=null}clearTimeout(wsTimer);
 for(const c of COLS)S[c]={};company={};SERIES={};CUSTOM_ROLES={};APPROVALS={};applyRoles();USERS={};me.id=null;mode='connecting';ready=false;st.draft=null;mclose();
 $('#lerr').textContent=msg||'';$('#login').hidden=false;$('#view').innerHTML='';setTimeout(()=>$('#lemail').focus(),50)}
function setMe(u){me.id=u.id;me.name=u.name;me.email=u.email;me.empCode=u.empCode||'';me.designation=u.designation||'';me.roles=rolesOf(u.role);me.role=me.roles.join(', ')||'No role';me.owner=me.roles.includes('Admin');$('#login').hidden=true}
async function loadAll(){const r=await API.j('GET','/api/all');for(const c of COLS)S[c]={};
 SERIES={};for(const x of r.docs){if(x.collection==='settings'){if(x.id==='company')company=x.data;if(x.id==='series')SERIES=x.data||{};if(x.id==='roles')CUSTOM_ROLES=x.data||{};if(x.id==='approvals')APPROVALS=x.data||{}}else if(S[x.collection])S[x.collection][x.id]=x.data}
 applyRoles();USERS={};for(const u of r.users)USERS[u.id]=u;mode='live';ready=true;stale=false;computeRole();applyLook();try{localStorage.setItem('erp_logo',company.logo&&company.logo.length<400000?company.logo:'')}catch(e){}if(!st.draft)render();else renderChrome();applyIcons();ensureIcons()}
async function refreshUsers(){try{const r=await API.j('GET','/api/users');USERS={};for(const u of r.users)USERS[u.id]=u;computeRole();schedule()}catch(e){}}
function connectWS(){clearTimeout(wsTimer);const p=location.protocol==='https:'?'wss':'ws';const sock=new WebSocket(`${p}://${location.host}/ws`);ws=sock;
 sock.onopen=()=>{if(wsTry>0)loadAll().catch(()=>{});wsTry=0;stale=false;renderChrome()};
 sock.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
  if(m.t==='doc'){if(m.c==='settings'){if(m.id==='company'){company=m.d||{};applyIcons()}if(m.id==='series')SERIES=m.d||{};if(m.id==='roles'){CUSTOM_ROLES=m.d||{};applyRoles();computeRole()}if(m.id==='approvals')APPROVALS=m.d||{}}else if(S[m.c]){if(m.d==null)delete S[m.c][m.id];else S[m.c][m.id]=m.d}schedule()}
  if(m.t==='users')refreshUsers();
  if(m.t==='reset'){toast(`All transactions were reset by ${m.by||'the Master user'}. Reloading…`);setTimeout(()=>location.reload(),1500)}};
 sock.onclose=e=>{if(ws!==sock)return;ws=null;if(e.code===4001){API.j('GET','/api/me').catch(()=>{});return}
  stale=true;renderChrome();wsTimer=setTimeout(connectWS,e.code===4002?200:Math.min(30000,1000*2**(wsTry++)))}}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('#lbtn');btn.disabled=true;$('#lerr').textContent='';
 try{const r=await API.j('POST','/api/login',{email:$('#lemail').value.trim(),password:$('#lpass').value});$('#lpass').value='';setMe(r.user);await loadAll();wsTry=0;connectWS();route()}
 catch(x){$('#lerr').textContent=x.message||'Sign-in failed.'}finally{btn.disabled=false}});
// Logo / company name always lead to the home screen, even when already on it.
document.addEventListener('click',e=>{const a=e.target.closest('a[href="#dash"]');if(a&&location.hash==='#dash'){e.preventDefault();route()}});

/* ---------- mobile app (PWA) ---------- */
let installEvt=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;renderWho()});
window.addEventListener('appinstalled',()=>{installEvt=null;renderWho();toast('App installed')});
// Install app lives in the account menu (under Change password), shown only when this device can install it.
function canInstall(){return !standalone()&&(!!installEvt||isIOS)}
async function installApp(){
 if(installEvt){installEvt.prompt();await installEvt.userChoice.catch(()=>{});installEvt=null;renderWho();return}
 modal(`<h2>Install on iPhone / iPad</h2><ol style="padding-left:18px;line-height:1.9;margin:0"><li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button (square with an arrow).</li><li>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol><div class="acts"><button class="btn pri" data-act="mclose">OK</button></div>`)}
// Phones pause the connection in the background; catch up as soon as the app is opened again.
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&me.id&&(!ws||ws.readyState>1)){wsTry=0;loadAll().catch(()=>{});connectWS()}});

try{applyLook(JSON.parse(localStorage.getItem('erp_look')||'{}'))}catch(e){}
route();
if(!me.id)V.innerHTML=`<div class="pload">${loaderHTML('Loading…')}</div>`;
(async()=>{try{const r=await API.j('GET','/api/me');setMe(r.user);await loadAll();connectWS()}catch(e){if(e.code!=='unauth'){$('#login').hidden=false;$('#lerr').textContent=e.message}}})();
