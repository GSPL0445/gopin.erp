# Nginx site for Gopin Semicon ERP
# 1. Replace erp.gopinsemicon.com with your domain (2 places).
# 2. Copy to /etc/nginx/sites-available/erp and enable it (see README).
# 3. Run certbot to add HTTPS:  sudo certbot --nginx -d erp.gopinsemicon.com

server {
    listen 80;
    server_name erp.gopinsemicon.com;

    client_max_body_size 5m;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Live updates
    location /ws {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }
}
